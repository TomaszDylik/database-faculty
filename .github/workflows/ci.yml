name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium (Checkout)
        uses: actions/checkout@v3

      - name: Weryfikacja budowania obrazów Docker Compose
        run: docker compose build

      - name: Weryfikacja kodu Frontend (Instalacja zależności)
        working-directory: ./frontend
        run: npm install