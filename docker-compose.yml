services:
  postgres:
    image: postgres:16-alpine
    container_name: database-faculty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat_app}
      POSTGRES_USER: ${POSTGRES_USER:-chat_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: >-
        pg_isready -U ${POSTGRES_USER:-chat_user} -d ${POSTGRES_DB:-chat_app}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo:
    image: mongo:7
    container_name: database-faculty-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-chat_root}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-chat_messages}
    secrets:
      - mongo_password
    volumes:
      - mongo_data:/data/db
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: >-
        mongosh --quiet --username ${MONGO_INITDB_ROOT_USERNAME:-chat_root}
        --password $$(cat /run/secrets/mongo_password)
        --authenticationDatabase admin
        --eval "quit(db.adminCommand('ping').ok ? 0 : 2)"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: database-faculty-redis
    restart: unless-stopped
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  service-pg:
    build:
      context: ./services/service-pg
      dockerfile: Dockerfile
    container_name: database-faculty-service-pg
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8081
      DATABASE_URL: ${DATABASE_URL:-postgresql://chat_user:chat_password@postgres:5432/chat_app?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    networks:
      - private_net
      - public_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 15s
    healthcheck:
      test: >-
        node -e "fetch('http://127.0.0.1:8081/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  service-mongo:
    build:
      context: ./services/service-mongo
      dockerfile: Dockerfile
    container_name: database-faculty-service-mongo
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8082
      DATABASE_URL: ${DATABASE_URL:-postgresql://chat_user:chat_password@postgres:5432/chat_app?schema=public}
      MONGO_URI: ${MONGO_URI:-mongodb://chat_root:chat_password@mongo:27017/chat_messages?authSource=admin}
    networks:
      - private_net
      - public_net
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 15s
    healthcheck:
      test: >-
        node -e "fetch('http://127.0.0.1:8082/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: database-faculty-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      SERVICE_PG_URL: ${SERVICE_PG_URL:-http://service-pg:8081}
      SERVICE_MONGO_URL: ${SERVICE_MONGO_URL:-http://service-mongo:8082}
    networks:
      - public_net
    depends_on:
      service-pg:
        condition: service_healthy
      service-mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 15s
    healthcheck:
      test: >-
        node -e "fetch('http://127.0.0.1:8080/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: database-faculty-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - public_net
    depends_on:
      api-gateway:
        condition: service_healthy
    command: /bin/sh -c "echo 'server { listen 80; location / { proxy_pass http://api-gateway:8080; proxy_set_header Host $$host; proxy_set_header X-Real-IP $$remote_addr; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
      /bin/sh -c "echo '
      server { 
        listen 80; 
        location / { 
          proxy_pass http://api-gateway:8080; 
          proxy_set_header Host $$host; 
          proxy_set_header X-Real-IP $$remote_addr; 
        } 
      }' > /etc/nginx/conf.d/default.conf 
      && nginx -g 'daemon off;'"

  adminer:
    image: adminer:latest
    container_name: database-faculty-adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    networks:
      - public_net
      - private_net
    profiles:
      - dev
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data: {}
  mongo_data: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  mongo_password:
    file: ./secrets/mongo_password.txt

networks:
  public_net: {}
  private_net: {}