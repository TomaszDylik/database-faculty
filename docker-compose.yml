services:
  postgres:
    image: postgres:16-alpine
    container_name: database-faculty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat_app}
      POSTGRES_USER: ${POSTGRES_USER:-chat_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_net
    healthcheck:
      test: >-
        pg_isready -U ${POSTGRES_USER:-chat_user} -d ${POSTGRES_DB:-chat_app}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo:
    image: mongo:7
    container_name: database-faculty-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-chat_root}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-chat_messages}
    secrets:
      - mongo_password
    volumes:
      - mongo_data:/data/db
    networks:
      - private_net
    healthcheck:
      test: >-
        mongosh --quiet --username ${MONGO_INITDB_ROOT_USERNAME:-chat_root}
        --password $$(cat /run/secrets/mongo_password)
        --authenticationDatabase admin
        --eval "quit(db.adminCommand('ping').ok ? 0 : 2)"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  service-pg:
    build:
      context: ./services/service-pg
      dockerfile: Dockerfile
    container_name: database-faculty-service-pg
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8081
      DATABASE_URL: ${DATABASE_URL:-postgresql://chat_user:chat_password@postgres:5432/chat_app?schema=public}
    ports:
      - "${SERVICE_PG_PORT:-8081}:8081"
    networks:
      - private_net
      - public_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: >-
        node -e "fetch('http://127.0.0.1:8081/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  service-mongo:
    build:
      context: ./services/service-mongo
      dockerfile: Dockerfile
    container_name: database-faculty-service-mongo
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8082
      DATABASE_URL: ${DATABASE_URL:-postgresql://chat_user:chat_password@postgres:5432/chat_app?schema=public}
      MONGO_URI: ${MONGO_URI:-mongodb://chat_root:chat_password@mongo:27017/chat_messages?authSource=admin}
    ports:
      - "${SERVICE_MONGO_PORT:-8082}:8082"
    networks:
      - private_net
      - public_net
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: >-
        node -e "fetch('http://127.0.0.1:8082/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: database-faculty-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      SERVICE_PG_URL: ${SERVICE_PG_URL:-http://service-pg:8081}
      SERVICE_MONGO_URL: ${SERVICE_MONGO_URL:-http://service-mongo:8082}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    networks:
      - public_net
    depends_on:
      service-pg:
        condition: service_healthy
      service-mongo:
        condition: service_healthy
    healthcheck:
      test: >-
        node -e "fetch('http://127.0.0.1:8080/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data: {}
  mongo_data: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  mongo_password:
    file: ./secrets/mongo_password.txt

networks:
  public_net: {}
  private_net: {}
